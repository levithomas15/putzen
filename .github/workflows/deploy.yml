name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [claude/3d-cleaning-game-5qt2cc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft ein Deployment noch, wird es nicht abgebrochen — sonst kann eine halb
# hochgeladene Seite online stehen bleiben.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    env:
      # Playwright steckt in den devDependencies und wird nur für die Tests
      # gebraucht. Ohne diese Zeile lädt es hier sinnlos Browser herunter.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Syntaxprüfung
        run: npm run lint

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Schaltet Pages beim ersten Lauf selbst frei, damit dafür niemand
          # in die Repo-Einstellungen muss.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
